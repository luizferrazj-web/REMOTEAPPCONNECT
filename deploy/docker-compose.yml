# Servidor próprio (opcional): sinalização PeerServer + retransmissor TURN.
# Uso: cp .env.example .env (edite) && docker compose up -d
services:
  peerserver:
    image: peerjs/peerjs-server
    restart: always
    command: ["--port", "9000", "--path", "/"]
    ports:
      - "9000:9000"
  coturn:
    image: coturn/coturn:latest
    restart: always
    network_mode: host
    command: >
      -n --log-file=stdout --realm=ideia --fingerprint --lt-cred-mech
      --user=${TURN_USER}:${TURN_PASS} --external-ip=${PUBLIC_HOST}
      --min-port=49160 --max-port=49200 --no-multicast-peers
