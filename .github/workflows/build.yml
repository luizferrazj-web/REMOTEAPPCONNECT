name: Build

permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar como Release com esta tag (ex.: v0.2.0). Vazio = só compilar.'
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: dist/win-unpacked/IDEIA Remote.exe
          - os: ubuntu-latest
            bin: dist/linux-unpacked/ideia-remote
          - os: macos-latest
            bin: dist/mac-arm64/IDEIA Remote.app/Contents/MacOS/IDEIA Remote
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 "dist/mac-arm64/IDEIA Remote.app"
      # Conecta dois apps já empacotados pelo serviço público antes de publicar.
      # No macOS o runner não concede gravação de tela ao app empacotado, então lá o teste só informa.
      - name: Testar o app empacotado
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          SIGNALING: public
          ELECTRON_BIN: ${{ github.workspace }}/app/${{ matrix.bin }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1280x800x24"' || '' }} node test/e2e.js
      - uses: actions/upload-artifact@v4
        with:
          name: ideia-remote-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: IDEIA Remote ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Instale nos dois computadores e conecte pelo ID e senha.
            - **Windows**: `IDEIA-Remote-Setup-*.exe`
            - **Mac (Apple Silicon)**: arquivo `.dmg`
            - **Linux**: `.AppImage` ou `.deb`
          files: out/*
